version: '3.9'

services:
  app:
    build:
      context: ./docker/php
    container_name: classhub_app
    volumes:
      - ./classhub-api:/var/www
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      RUN_MIGRATIONS: "true"
    depends_on:
      - mysql
    networks:
      - classhub

  nginx:
    image: nginx:latest
    container_name: classhub_nginx
    ports:
      - "8000:80"
    volumes:
      - ./classhub-api:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - classhub

  mysql:
    image: mysql:8.0
    container_name: classhub_mysql
    restart: always
    environment:
      MYSQL_DATABASE: classhub
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - classhub

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: classhub_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    networks:
      - classhub

  redis:
    image: redis:alpine
    container_name: classhub_redis
    ports:
      - "6379:6379"
    networks:
      - classhub

networks:
  classhub:

volumes:
  dbdata: