<header class="header">

  <div class="brand-text">

    <img src="/images/logo.png" class="logo">

    <div>
      <div class="app-name">

        ClassHub

      </div>
    </div>

  </div>

  <nav class="nav-links">

    <button mat-button routerLink="/dashboard" routerLinkActive="active-link">

      Dashboards

    </button>

    @if (isTeacher) {

    <button mat-button routerLink="/academies" routerLinkActive="active-link">

      Mis Academias

    </button>

    <button mat-button routerLink="/my-schedule" routerLinkActive="active-link">

      Mis Horarios

    </button>

    <button mat-button routerLink="/my-pendings" routerLinkActive="active-link">

      Mis Pendientes

    </button>

    }

    @if (isAdmin) {

    <button mat-button routerLink="/academies-management" routerLinkActive="active-link">

      Academias

    </button>

    <button mat-button routerLink="/classrooms" routerLinkActive="active-link">

      Grupos

    </button>

    <button mat-button routerLink="/students" routerLinkActive="active-link">

      Estudiantes

    </button>

    <button mat-button routerLink="/schools" routerLinkActive="active-link">

      Escuelas

    </button>

    <button mat-button routerLink="/users" routerLinkActive="active-link">

      Usuarios

    </button>

    }

  </nav>

  <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-trigger">

    <mat-icon>account_circle</mat-icon>

    <div class="user-info">
      <div>{{ user?.name }}</div>
      <small>{{ schoolName }}</small>
    </div>

    <mat-icon>expand_more</mat-icon>

  </button>

  <mat-menu #userMenu="matMenu">

    <div class="menu-header">
      <strong>{{ user?.name }}</strong>
      <div>{{ user?.email }}</div>
    </div>

    <mat-divider></mat-divider>

    <button mat-menu-item (click)="changeSchool()">

      <mat-icon>school</mat-icon>
      <span>Cambiar Escuela</span>

    </button>

    <button mat-menu-item>

      <mat-icon>person</mat-icon>
      <span>Mi Perfil</span>

    </button>

    <mat-divider></mat-divider>

    <button
      mat-menu-item
      (click)="logout()"
      class="logout-item">

      <mat-icon>logout</mat-icon>
      <span>Cerrar Sesión</span>

    </button>

  </mat-menu>

</header>
