<app-header />

<div class="page-container">

  <div class="page-header">

    <div>

      <h1>
        Academias
      </h1>

      <p>
        Catálogo de academias
      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      routerLink="/academies-management/new">

      Nueva Academia

    </button>

  </div>

  <ng-template
    #actionsTemplate
    let-academy>

    <button
      mat-button
      color="accent"
      [routerLink]="[
        '/academies-management',
        academy.id,
        'teachers'
      ]">

      Docentes

    </button>

    <button
      mat-button
      color="primary"
      [routerLink]="[
        '/academies-management/edit',
        academy.id
      ]">

      Editar

    </button>

    <button
      mat-button
      color="warn"
      (click)="
        deleteAcademy(
          academy.id
        )
      ">

      Eliminar

    </button>

  </ng-template>

  @if (loading) {

    <p>
      Cargando academias...
    </p>

  } @else {

    <app-data-table
      [data]="academies"
      [columns]="columns">
    </app-data-table>

  }

</div>
