<app-header />

<div class="form-container">

  <h1>

    @if (isEditMode) {

      Editar Academia

    } @else {

      Nueva Academia

    }

  </h1>

  <form
    [formGroup]="form"
    (ngSubmit)="save()">

    <mat-form-field
      appearance="outline">

      <mat-label>
        Nombre
      </mat-label>

      <input
        matInput
        formControlName="name">

      @if (
        form.controls.name.invalid &&
        form.controls.name.touched
      ) {

        <mat-error>

          El nombre es obligatorio

        </mat-error>

      }

    </mat-form-field>

    <div class="actions">

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="loading">

        @if (loading) {

          Guardando...

        } @else {

          Guardar

        }

      </button>

      <button
        mat-button
        type="button"
        (click)="cancel()">

        Cancelar

      </button>

    </div>

  </form>

</div>
