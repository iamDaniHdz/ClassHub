<app-header />

<div class="page-container">

  <div class="page-header">

    <div>

      <h1>
        Estudiantes
      </h1>

      <p>
        Administración de estudiantes
      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      routerLink="/students/new">

      Nuevo Estudiante

    </button>

  </div>

  <ng-template
    #actionsTemplate
    let-student>

    <button
      mat-button
      color="primary"
      [routerLink]="[
        '/students/edit',
        student.id
      ]">

      Editar

    </button>

    <button
      mat-button
      color="warn"
      (click)="deleteStudent(student.id)">

      Eliminar

    </button>

  </ng-template>

  <ng-template
    #statusTemplate
    let-student>

    <mat-chip
      [class.active-chip]="student.is_active"
      [class.inactive-chip]="!student.is_active">

      {{
        student.is_active
          ? 'Activo'
          : 'Inactivo'
      }}

    </mat-chip>

  </ng-template>

  @if (loading) {

    <p>
      Cargando estudiantes...
    </p>

  } @else {

    <app-data-table
      [data]="students"
      [columns]="columns">
    </app-data-table>

  }

</div>
