<div class="login-container">

  <mat-card>
    <mat-card-header>
      <mat-card-title>ClassHub Login</mat-card-title>
    </mat-card-header>

    <mat-card-content>

      <!-- VIEW MODEL -->
      @if (vm$ | async; as vm) {
        <form (ngSubmit)="login()">

          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Email</mat-label>
            <input matInput [(ngModel)]="email" name="email">
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Password</mat-label>
            <input matInput type="password" [(ngModel)]="password" name="password">
          </mat-form-field>

          <button mat-flat-button color="primary" class="w-100" [disabled]="vm.loading">
            {{ vm.loading ? 'Ingresando...' : 'Login' }}
          </button>

          @if (vm.error) {
            <p class="error">{{ vm.error }}</p>
          }

        </form>

      } @else {
        <p>Ingresa tus credenciales</p>
      }

    </mat-card-content>

  </mat-card>

</div>
