<app-header />

<div class="container">

  <h1>
    Selecciona una escuela
  </h1>

  <p>
    Elige la escuela con la que deseas trabajar.
  </p>

  @if (loading) {

    <p>
      Cargando escuelas...
    </p>

  } @else {

    <div
      class="schools-list">

      @for (
        school of schools;
        track school.id
      ) {

        <mat-card
          class="school-card">

          <mat-card-content>

            <h2>
              {{ school.name }}
            </h2>

          </mat-card-content>

          <mat-card-actions>

            <button
              mat-raised-button
              color="primary"
              (click)="
                selectSchool(
                  school
                )
              ">

              Entrar

            </button>

          </mat-card-actions>

        </mat-card>

      }

    </div>

  }

</div>
