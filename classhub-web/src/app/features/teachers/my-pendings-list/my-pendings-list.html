<app-header />

<div class="page-container">

  <div class="page-header">

    <div>

      <h1>
        Mis Pendientes
      </h1>

      <p>
        Ponte al día con tus pendientes
      </p>

    </div>

  </div>

  <ng-template
    #statusTemplate
    let-pending>

    <mat-checkbox
      [checked]="
        pending.is_completed
      "
      (change)="
        toggleStatus(
          pending
        )
      ">
    </mat-checkbox>

  </ng-template>

  <ng-template
    #dueDateTemplate
    let-pending>

    <span
      [class.overdue]="
        isOverdue(
          pending
        )
      ">

      {{
        pending.due_date
        ?? 'Sin fecha'
      }}

    </span>

  </ng-template>

  <ng-template
    #actionsTemplate
    let-pending>

    <button
      mat-button
      color="primary"
      [routerLink]="[
        '/my-pendings/edit',
        pending.id
      ]">

      Editar

    </button>

    <button
      mat-button
      color="warn"
      (click)="
        deletePending(
          pending.id
        )
      ">

      Eliminar

    </button>

  </ng-template>

  @if (loading) {

    <p>
      Cargando...
    </p>

  } @else {

    <app-data-table
      [data]="pendings"
      [columns]="columns">
    </app-data-table>

  }

</div>
