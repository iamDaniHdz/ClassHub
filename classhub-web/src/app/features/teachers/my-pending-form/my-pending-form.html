<app-header />

<div class="page-container">

  <h1>

    @if (isEditMode) {

      Editar Pendiente

    } @else {

      Nuevo Pendiente

    }

  </h1>

  <form
    [formGroup]="form"
    (ngSubmit)="save()">

    <mat-form-field
      appearance="outline">

      <mat-label>
        Academia / Grupo
      </mat-label>

      <mat-select
        formControlName="academy_assignment_id">

        @for (
          assignment of assignments;
          track assignment.assignment_id
        ) {

          <mat-option
            [value]="
              assignment.assignment_id
            ">

            {{
              assignment.academy.name
            }}
            -
            {{
              assignment.classroom.name
            }}

          </mat-option>

        }

      </mat-select>

    </mat-form-field>

    <mat-form-field
      appearance="outline">

      <mat-label>
        Título
      </mat-label>

      <input
        matInput
        formControlName="title">

    </mat-form-field>

    <mat-form-field
      appearance="outline">

      <mat-label>
        Descripción
      </mat-label>

      <textarea
        matInput
        rows="4"
        formControlName="description">
      </textarea>

    </mat-form-field>

    <mat-form-field
    appearance="outline">

    <mat-label>
        Fecha límite
    </mat-label>

    <input
        matInput
        type="date"
        formControlName="due_date">

    </mat-form-field>


    <div class="actions">

      <button
        mat-raised-button
        color="primary"
        type="submit">

        Guardar

      </button>

      <button
        mat-button
        type="button"
        (click)="cancel()">

        Cancelar

      </button>

    </div>

  </form>

</div>
