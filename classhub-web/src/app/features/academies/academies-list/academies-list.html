<app-header />

<div class="page-container">

  <div class="page-header">

    <div>

      <h1>
        Academias
      </h1>

      <p>
        Asignaturas y grupos asignados
      </p>

    </div>

  </div>

  <ng-template
    #actionsTemplate
    let-academy>

    <button
      mat-button
      color="primary"
      [routerLink]="[
        '/classrooms',
        academy.classroom.id
      ]">

      Estudiantes

    </button>

  </ng-template>

  @if (loading) {

    <p>
      Cargando academias...
    </p>

  } @else {

    <app-data-table
      [data]="academies"
      [columns]="columns">
    </app-data-table>

  }

</div>
