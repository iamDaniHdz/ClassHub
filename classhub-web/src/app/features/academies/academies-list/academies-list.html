<app-header />

<div class="container">

  <div class="page-header">

    <h1>Academias</h1>

    <p>
      Asignaturas y grupos asignados
    </p>

  </div>

  <table
    mat-table
    [dataSource]="dataSource"
    class="academies-table mat-elevation-z2">

    <!-- Academia -->

    <ng-container matColumnDef="academy">

      <th
        mat-header-cell
        *matHeaderCellDef>

        Academia

      </th>

      <td
        mat-cell
        *matCellDef="let academy">

        {{ academy.academy.name }}

      </td>

    </ng-container>

    <!-- Grupo -->

    <ng-container matColumnDef="classroom">

      <th
        mat-header-cell
        *matHeaderCellDef>

        Grupo

      </th>

      <td
        mat-cell
        *matCellDef="let academy">

        {{ academy.classroom.name }}

      </td>

    </ng-container>

    <!-- Alumnos -->

    <ng-container matColumnDef="students">

      <th
        mat-header-cell
        *matHeaderCellDef>

        Alumnos

      </th>

      <td
        mat-cell
        *matCellDef="let academy">

        {{ academy.students_count }}

      </td>

    </ng-container>

    <!-- Docente -->

    <ng-container matColumnDef="teacher">

      <th
        mat-header-cell
        *matHeaderCellDef>

        Docente

      </th>

      <td
        mat-cell
        *matCellDef="let academy">

        {{ academy.teacher.name }}

      </td>

    </ng-container>

    <!-- Acciones -->

    <ng-container matColumnDef="actions">

      <th
        mat-header-cell
        *matHeaderCellDef>

        Acciones

      </th>

      <td
        mat-cell
        *matCellDef="let academy">

        <button
          mat-raised-button
          color="primary">

          Ver grupo

        </button>

      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
      mat-row
      *matRowDef="
        let row;
        columns: displayedColumns
      ">
    </tr>

  </table>

</div>
