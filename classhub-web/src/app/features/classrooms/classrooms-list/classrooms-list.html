<app-header />

<div class="page-container">

  <div class="page-header">

    <div>

      <h1>
        Grupos
      </h1>

      <p>
        Administración de grupos escolares
      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      routerLink="/classrooms/new">

      Nuevo Grupo

    </button>

  </div>

  <ng-template
    #actionsTemplate
    let-classroom>

    <button
      mat-button
      color="primary"
      [routerLink]="[
        '/classrooms/edit',
        classroom.id
      ]">

      Editar

    </button>

    <button
      mat-button
      color="accent"
      [routerLink]="[
        '/classrooms',
        classroom.id,
        'academies'
      ]">

      Academias

    </button>

    <button
      mat-button
      color="primary"
      [routerLink]="[
        '/classrooms',
        classroom.id
      ]">

      Estudiantes

    </button>

    <button
      mat-button
      color="warn"
      (click)="
        deleteClassroom(
          classroom.id
        )
      ">

      Eliminar

    </button>

  </ng-template>

  @if (loading) {

    <p>
      Cargando grupos...
    </p>

  } @else {

    <app-data-table
      [data]="classrooms"
      [columns]="columns">
    </app-data-table>

  }

</div>
