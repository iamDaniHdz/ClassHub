<app-header />

<div class="container">

  <div class="page-header">

    <div>

      <h1>Grupos</h1>

      <p>
        Administración de grupos escolares
      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      routerLink="/classrooms/new">

      Nuevo Grupo

    </button>

  </div>

  @if (loading) {

    <p>Cargando grupos...</p>

  } @else {

    <table
      mat-table
      [dataSource]="classrooms"
      class="classrooms-table mat-elevation-z2">

      <!-- Grupo -->

      <ng-container matColumnDef="group">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Grupo

        </th>

        <td
          mat-cell
          *matCellDef="let classroom">

          {{ classroom.group }}

        </td>

      </ng-container>

      <!-- Grado -->

      <ng-container matColumnDef="degree">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Grado

        </th>

        <td
          mat-cell
          *matCellDef="let classroom">

          {{ classroom.degree }}

        </td>

      </ng-container>

      <!-- Alumnos -->

      <ng-container matColumnDef="students">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Alumnos

        </th>

        <td
          mat-cell
          *matCellDef="let classroom">

          {{ classroom.students_count ?? 0 }}

        </td>

      </ng-container>

      <!-- Acciones -->

      <ng-container matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Acciones

        </th>

        <td
          mat-cell
          *matCellDef="let classroom">

          <div class="actions">

            <button
              mat-button
              color="primary"
              [routerLink]="[
                '/classrooms/edit',
                classroom.id
              ]">

              Editar

            </button>

            <button
              mat-button
              color="warn"
              (click)="deleteClassroom(classroom.id)">

              Eliminar

            </button>

          </div>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns
        ">
      </tr>

    </table>

  }

</div>
