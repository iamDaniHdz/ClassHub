<app-header />

<div class="page-container">

  <ng-template
    #statusTemplate
    let-student>

    <mat-chip
      [class.active-chip]="student.is_active"
      [class.inactive-chip]="!student.is_active">

      {{
        student.is_active
          ? 'Activo'
          : 'Inactivo'
      }}

    </mat-chip>

  </ng-template>

  @if (loading) {

    <p>
      Cargando estudiantes...
    </p>

  } @else {

    <div class="page-header">

      <div>

        <h1>
          Estudiantes del grupo
        </h1>

        <p>
          {{ classroom.degree }}°{{ classroom.group }}
          ·
          {{ classroom.students_count }}
          alumnos
        </p>

      </div>

    </div>

    <app-data-table
      [data]="students"
      [columns]="columns">
    </app-data-table>

  }

</div>
