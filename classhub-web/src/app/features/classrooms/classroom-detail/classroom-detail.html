<app-header />

@if (loading) {

  <div class="container">

    <h2>Cargando grupo...</h2>

  </div>

} @else {

  <div class="container">

    <div class="page-header">

      <h1>
        Grupo {{ classroom.degree }}° {{ classroom.group }}
      </h1>

      <p>
        Total de alumnos:
        {{ classroom.students_count }}
      </p>

    </div>

    <table
      mat-table
      [dataSource]="classroom.students"
      class="students-table mat-elevation-z2">

      <!-- Alumno -->

      <ng-container matColumnDef="name">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Alumno

        </th>

        <td
          mat-cell
          *matCellDef="let item">

          {{ item.student.name }}
          {{ item.student.paternal_surname }}
          {{ item.student.maternal_surname }}

        </td>

      </ng-container>

      <!-- Acciones -->

      <ng-container matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Acciones

        </th>

        <td
          mat-cell
          *matCellDef="let item">

          <button
            mat-raised-button
            color="primary"
            [routerLink]="[
              '/students',
              item.student_assignment_id
            ]">

            Ver alumno

          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns
        ">
      </tr>

    </table>

  </div>

}
