<app-header />

<div class="form-container">

  <h1>

    @if (isEditMode) {

      Editar Grupo

    } @else {

      Nuevo Grupo

    }

  </h1>

  <form
    [formGroup]="form"
    (ngSubmit)="save()">

    <mat-form-field
      appearance="outline">

      <mat-label>
        Grado
      </mat-label>

      <input
        matInput
        formControlName="degree">

    </mat-form-field>

    <mat-form-field
      appearance="outline">

      <mat-label>
        Grupo
      </mat-label>

      <input
        matInput
        formControlName="group">

    </mat-form-field>

    <div class="actions">

      <button
        mat-raised-button
        color="primary"
        type="submit">

        Guardar

      </button>

      <button
        mat-button
        type="button"
        (click)="cancel()">

        Cancelar

      </button>

    </div>

  </form>

</div>
