<app-header />

<div class="container">

  <div class="page-header">

    <div>

      <h1>
        Escuelas
      </h1>

      <p>
        Administración de escuelas
      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      routerLink="/schools/new">

      Nueva Escuela

    </button>

  </div>

  @if (loading) {

    <p>
      Cargando escuelas...
    </p>

  } @else {

    <table class="custom-table">

      <thead>

        <tr>

          <th>
            Nombre
          </th>

          <th>
            Acciones
          </th>

        </tr>

      </thead>

      <tbody>

        @for (
          school of schools;
          track school.id
        ) {

          <tr>

            <td>
              {{ school.name }}
            </td>

            <td>

              <button
                mat-button
                color="primary"
                [routerLink]="[
                  '/schools/edit',
                  school.id
                ]">

                Editar

              </button>

              <button
                mat-button
                color="warn"
                (click)="deleteSchool(
                  school.id
                )">

                Eliminar

              </button>

            </td>

          </tr>

        }

      </tbody>

    </table>

  }

</div>
