<app-header />

<div class="page-container">

  <div class="page-header">

    <div>

      <h1>
        Escuelas
      </h1>

      <p>
        Administración de escuelas
      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      routerLink="/schools/new">

      Nueva Escuela

    </button>

  </div>

  <ng-template
    #actionsTemplate
    let-school>

    <button
      mat-button
      color="primary"
      [routerLink]="[
        '/schools/edit',
        school.id
      ]">

      Editar

    </button>

    <button
      mat-button
      color="warn"
      (click)="
        deleteSchool(
          school.id
        )
      ">

      Eliminar

    </button>

  </ng-template>

  @if (loading) {

    <p>
      Cargando escuelas...
    </p>

  } @else {

    <app-data-table
      [data]="schools"
      [columns]="columns">
    </app-data-table>

  }

</div>
