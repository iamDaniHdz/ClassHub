<app-header />

<div class="form-container">

  <h1>

    @if (isEditMode) {

      Editar Escuela

    } @else {

      Nueva Escuela

    }

  </h1>

  <form
    [formGroup]="form"
    (ngSubmit)="save()">

    <mat-form-field
      appearance="outline">

      <mat-label>
        Nombre
      </mat-label>

      <input
        matInput
        formControlName="name">

    </mat-form-field>

    <div class="actions">

      <button
        mat-raised-button
        color="primary"
        type="submit">

        Guardar

      </button>

      <button
        mat-button
        type="button"
        (click)="cancel()">

        Cancelar

      </button>

    </div>

  </form>

</div>
