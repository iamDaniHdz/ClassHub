<table
  mat-table
  [dataSource]="dataSource"
  matSort
  class="table">

  @for (
    column of columns;
    track column.key
  ) {

    <ng-container
      [matColumnDef]="column.key">


        <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header>

        {{ column.header }}

        </th>


      <td
        mat-cell
        *matCellDef="let row">

        @if (
          column.cellTemplate
        ) {

          <ng-container
            *ngTemplateOutlet="
              column.cellTemplate;
              context: {
                $implicit: row
              }
            ">
          </ng-container>

        } @else {

          {{ row[column.key] }}

        }

      </td>

    </ng-container>

  }

  <tr
    mat-header-row
    *matHeaderRowDef="
      displayedColumns
    ">
  </tr>

  <tr
    mat-row
    *matRowDef="
      let row;
      columns: displayedColumns
    ">
  </tr>

</table>

<mat-paginator
  [pageSize]="pageSize"
  [pageSizeOptions]="[
    5,
    10,
    25,
    50
  ]"
  showFirstLastButtons>
</mat-paginator>
